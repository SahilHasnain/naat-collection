name: Deploy Brand Privacy Policies to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/gh-pages.yml"
      - "apps/mobile/brands/**/brand.config.js"
      - "docs/privacy-policy.template.html"
      - "scripts/build-privacy-site.js"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build privacy site
        run: npm run build:privacy
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "privacy-site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
