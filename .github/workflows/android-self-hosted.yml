name: Android Self Hosted

on:
  workflow_dispatch:
    inputs:
      app_variant:
        description: App variant to build
        required: false
        default: production
        type: choice
        options:
          - development
          - preview
          - production
  push:
    branches:
      - main
    paths:
      - apps/mobile/app.config.js

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      EXPO_USE_METRO_WORKSPACE_ROOT: "1"
      APP_VARIANT: ${{ inputs.app_variant || 'production' }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache NDK
        uses: actions/cache@v4
        with:
          path: |
            apps/mobile/android/app/.cxx
            apps/mobile/android/.gradle
          key: ${{ runner.os }}-ndk-${{ hashFiles('apps/mobile/android/**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Install dependencies
        run: npm ci

      - name: Write Expo env file
        run: |
          cat > apps/mobile/.env.local <<EOF
          EXPO_USE_METRO_WORKSPACE_ROOT=${EXPO_USE_METRO_WORKSPACE_ROOT}
          APP_VARIANT=${APP_VARIANT}
          SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN}
          EOF

      - name: Configure Android SDK path
        run: |
          printf "sdk.dir=%s\n" "$ANDROID_SDK_ROOT" > apps/mobile/android/local.properties

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      - name: Decode Play Store JSON
        if: ${{ env.APP_VARIANT == 'production' }}
        run: |
          echo "${{ secrets.PLAY_STORE_JSON_BASE64 }}" | base64 -d > /tmp/play-store-key.json

      - name: Configure Sentry
        run: |
          cat > apps/mobile/android/sentry.properties <<'EOF'
          defaults.url=https://sentry.io/
          defaults.org=sahil-hasnain
          defaults.project=ubaid-raza-naats
          EOF

      - name: Build Android artifact
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          chmod +x ./gradlew
          if [ "$APP_VARIANT" = "preview" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew bundleRelease
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.APP_VARIANT }}-artifact
          path: |
            apps/mobile/android/app/build/outputs/**/*.aab
            apps/mobile/android/app/build/outputs/**/*.apk

      - name: Fastlane deploy
        if: ${{ env.APP_VARIANT == 'production' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SUPPLY_JSON_KEY: /tmp/play-store-key.json
          ANDROID_APPLICATION_ID: com.owaisrazaqadri
          PLAY_TRACK: production
          SKIP_ANDROID_BUILD: "true"
          ANDROID_KEYSTORE_PATH: /tmp/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd apps/mobile/android
          bundle install
          fastlane android deploy

      - name: Cleanup build artifacts
        if: always()
        run: |
          cd apps/mobile/android
          ./gradlew clean
          rm -rf ~/.gradle/caches/build-cache-*
