name: Android CI

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Brand/project ID from apps/mobile/brands, or all for parallel production builds
        required: true
        default: naat-collection
        type: string
      app_variant:
        description: Android artifact variant to build
        required: true
        default: debug-apk
        type: choice
        options:
          - debug-apk
          - production
      deploy_to_play:
        description: Upload a production AAB to Google Play
        required: true
        default: false
        type: boolean
      increment_version_code:
        description: Increment this brand's versionCode and commit it before building
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/android-self-hosted.yml
      - apps/mobile/scripts/patch-android-release-signing.mjs
  pull_request:
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/android-self-hosted.yml
      - apps/mobile/scripts/patch-android-release-signing.mjs

permissions:
  contents: write

concurrency:
  group: android-${{ github.event.inputs.project_id || 'naat-collection' }}-${{ github.event.inputs.app_variant || 'debug-apk' }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-build:
    name: Select brands to build
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.matrix.outputs.projects }}
    steps:
      - name: Create build matrix
        id: matrix
        env:
          PROJECT_SELECTION: ${{ github.event.inputs.project_id }}
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const selection = process.env.PROJECT_SELECTION;
          const projects = process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch'
            ? ['naat-collection']
            : selection === 'all'
              ? ['naat-collection', 'naat-production', 'anas-raza-attari', 'hafiz-tahir-qadri']
              : [selection || 'naat-collection'];
          console.log(`projects=${JSON.stringify(projects)}`);
          NODE

  increment-versions:
    name: Increment Android versionCode
    needs: prepare-build
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.increment_version_code == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Increment selected brand versionCode values and commit
        id: commit
        env:
          PROJECTS_JSON: ${{ needs.prepare-build.outputs.projects }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* ]]; then
            echo "VersionCode increments can only be committed from a branch, not $GITHUB_REF"
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const projectIds = JSON.parse(process.env.PROJECTS_JSON);
          for (const id of projectIds) {
            const file = path.join('brands', id, 'brand.config.js');
            if (!fs.existsSync(file)) throw new Error(`Unknown project "${id}"`);
            const source = fs.readFileSync(file, 'utf8');
            const pattern = /(versionCode\s*:\s*)(\d+)/g;
            const matches = [...source.matchAll(pattern)];
            if (matches.length !== 1) {
              throw new Error(`Expected exactly one versionCode in ${file}; found ${matches.length}`);
            }
            const current = Number(matches[0][2]);
            const next = current + 1;
            fs.writeFileSync(file, source.replace(pattern, (_match, prefix) => `${prefix}${next}`));
            console.log(`Incremented ${id} versionCode: ${current} -> ${next}`);
          }
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in brands/*/brand.config.js; do
            if git diff --quiet -- "$file"; then continue; fi
            git add "$file"
          done
          git commit -m "chore: increment Android versionCode [skip ci]"
          git push origin "HEAD:$GITHUB_REF"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-android:
    name: ${{ matrix.project_id }} / ${{ github.event.inputs.app_variant || 'debug-apk' }}
    runs-on: ubuntu-latest
    needs: [prepare-build, increment-versions]
    if: ${{ always() && needs.prepare-build.result == 'success' && (needs.increment-versions.result == 'success' || needs.increment-versions.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        project_id: ${{ fromJSON(needs.prepare-build.outputs.projects) }}
    environment: android-${{ matrix.project_id }}
    defaults:
      run:
        shell: bash
        working-directory: apps/mobile
    env:
      PROJECT_ID: ${{ matrix.project_id }}
      APP_VARIANT: ${{ github.event.inputs.app_variant || 'debug-apk' }}
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      EXPO_USE_METRO_WORKSPACE_ROOT: "1"
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.increment-versions.outputs.commit_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Ruby for Fastlane
        if: ${{ github.event.inputs.deploy_to_play == 'true' }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Install Fastlane dependencies
        if: ${{ github.event.inputs.deploy_to_play == 'true' }}
        run: bundle install --gemfile Gemfile

      - name: Install dependencies
        working-directory: .
        run: npm ci

      - name: Validate all-brand production options
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.project_id == 'all' }}
        env:
          APP_VARIANT_INPUT: ${{ github.event.inputs.app_variant }}
        run: |
          if [[ "$APP_VARIANT_INPUT" != "production" ]]; then
            echo "Select production when project_id is all."
            exit 1
          fi

      - name: Validate project and resolve Android identity
        id: brand
        env:
          APP_PROJECT_ID: ${{ env.PROJECT_ID }}
          APP_VARIANT: ${{ env.APP_VARIANT }}
          DEPLOY_TO_PLAY: ${{ github.event.inputs.deploy_to_play || 'false' }}
        run: |
          node <<'NODE'
          const { getProject, projectIds } = require('./brands');
          const id = process.env.APP_PROJECT_ID;
          if (!projectIds.includes(id)) {
            throw new Error(`Unknown project "${id}". Available: ${projectIds.join(', ')}`);
          }
          const brand = getProject(id);
          const variant = process.env.APP_VARIANT;
          if (process.env.DEPLOY_TO_PLAY === 'true' && variant !== 'production') {
            throw new Error('Google Play deployment is only available for production builds.');
          }
          const packageId = variant === 'debug-apk'
            ? brand.app.packageIdDev
            : variant === 'production'
              ? brand.app.packageId
              : null;
          if (!packageId) throw new Error(`Missing package ID for ${id}/${variant}`);
          if (variant === 'debug-apk' && !packageId.endsWith('.dev')) {
            throw new Error(`Debug APK package ID must end in .dev: ${packageId}`);
          }
          const values = {
            project_id: id,
            package_id: packageId,
            app_name: brand.app.name,
            version_code: String(brand.app.versionCode + Number(process.env.GITHUB_RUN_NUMBER || 0)),
            sentry_enabled: String(Boolean(brand.sentry?.enabled)),
            sentry_org: brand.sentry?.org || '',
            sentry_project: brand.sentry?.project || '',
          };
          for (const [key, value] of Object.entries(values)) {
            const safe = String(value).replace(/%/g, '%25').replace(/\n/g, '%0A').replace(/\r/g, '%0D');
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${safe}\n`);
          }
          for (const key of ['sentry_org', 'sentry_project']) {
            const value = String(values[key]).replace(/%/g, '%25').replace(/\n/g, '%0A').replace(/\r/g, '%0D');
            require('fs').appendFileSync(process.env.GITHUB_ENV, `${key === 'sentry_org' ? 'SENTRY_ORG' : 'SENTRY_PROJECT'}=${value}\n`);
          }
          NODE
          EXPO_VARIANT=development
          if [[ "$APP_VARIANT" == "production" ]]; then EXPO_VARIANT=production; fi
          APP_PROJECT_ID="$PROJECT_ID" APP_VARIANT="$EXPO_VARIANT" npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          APP_PROJECT_ID="$PROJECT_ID" EXPO_VARIANT="$EXPO_VARIANT" node -e 'const c=require(process.argv[1]); const b=require("./brands").getProject(process.env.APP_PROJECT_ID); const id=process.env.EXPO_VARIANT==="development"?b.app.packageIdDev:b.app.packageId; if(c.extra.projectId!==process.env.APP_PROJECT_ID || c.android.package!==id) throw new Error("Expo config identity does not match selected brand and variant")' "$RUNNER_TEMP/expo-config.json"

      - name: Generate selected Android project
        env:
          APP_PROJECT_ID: ${{ env.PROJECT_ID }}
          APP_VARIANT: ${{ env.APP_VARIANT == 'debug-apk' && 'development' || 'production' }}
          CI: "1"
        run: npx expo prebuild --platform android --no-install --clean

      - name: Prepare production signing
        if: ${{ env.APP_VARIANT == 'production' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.brand.outputs.version_code }}
        run: |
          required=(ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Missing required secret in GitHub environment android-${PROJECT_ID}: $name"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
          node scripts/patch-android-release-signing.mjs

      - name: Build debug APK
        if: ${{ env.APP_VARIANT == 'debug-apk' }}
        env:
          APP_PROJECT_ID: ${{ env.PROJECT_ID }}
          APP_VARIANT: development
        run: cd android && chmod +x ./gradlew && ./gradlew assembleDebug

      - name: Build production AAB
        if: ${{ env.APP_VARIANT == 'production' }}
        env:
          APP_PROJECT_ID: ${{ env.PROJECT_ID }}
          APP_VARIANT: production
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && chmod +x ./gradlew && ./gradlew bundleRelease

      - name: Upload APK artifact
        if: ${{ env.APP_VARIANT == 'debug-apk' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.brand.outputs.project_id }}-${{ env.APP_VARIANT }}-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload production AAB artifact
        if: ${{ env.APP_VARIANT == 'production' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.brand.outputs.project_id }}-production-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Decode Play Store service account
        if: ${{ env.APP_VARIANT == 'production' && github.event.inputs.deploy_to_play == 'true' }}
        env:
          PLAY_STORE_JSON_BASE64: ${{ secrets.PLAY_STORE_JSON_BASE64 }}
        run: |
          : "${PLAY_STORE_JSON_BASE64:?Missing PLAY_STORE_JSON_BASE64 secret in the selected project environment}"
          printf '%s' "$PLAY_STORE_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/play-store-key.json"

      - name: Deploy production bundle to Play
        if: ${{ env.APP_VARIANT == 'production' && github.event.inputs.deploy_to_play == 'true' }}
        working-directory: apps/mobile
        env:
          SUPPLY_JSON_KEY: ${{ runner.temp }}/play-store-key.json
          ANDROID_APPLICATION_ID: ${{ steps.brand.outputs.package_id }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'production' }}
          AAB_PATH: android/app/build/outputs/bundle/release/app-release.aab
        run: bundle exec fastlane android deploy
