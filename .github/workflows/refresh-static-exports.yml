name: Refresh Static Exports

on:
  schedule:
    # Daily at 02:00 UTC — runs after the Appwrite ingest-playlists function (00:00 UTC)
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-static-exports
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deps
        run: npm install --no-save node-appwrite fs-extra dotenv

      - name: Export all registered brands
        env:
          APPWRITE_API_KEY_NAAT_COLLECTION: ${{ secrets.APPWRITE_API_KEY_NAAT_COLLECTION }}
          APPWRITE_API_KEY_NAAT_PRODUCTION: ${{ secrets.APPWRITE_API_KEY_NAAT_PRODUCTION }}
          APPWRITE_API_KEY_ANAS_RAZA_ATTARI: ${{ secrets.APPWRITE_API_KEY_ANAS_RAZA_ATTARI }}
        shell: bash
        run: |
          set -euo pipefail

          export_brand() {
            local project_id="$1"
            local api_key="$2"
            if [[ -z "$api_key" ]]; then
              echo "Missing required API key secret for brand: $project_id" >&2
              return 1
            fi

            echo "Exporting static data for $project_id"
            APP_PROJECT_ID="$project_id" APPWRITE_API_KEY="$api_key" node scripts/export-naats-to-json.js
          }

          export_brand naat-collection "$APPWRITE_API_KEY_NAAT_COLLECTION"
          export_brand naat-production "$APPWRITE_API_KEY_NAAT_PRODUCTION"
          export_brand anas-raza-attari "$APPWRITE_API_KEY_ANAS_RAZA_ATTARI"

      - name: Commit updated exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-exports/
          if git diff --cached --quiet; then
            echo "No changes to static exports"
            exit 0
          fi
          git commit -m "chore: refresh static exports - $(date -u +%Y-%m-%d)"
          git push
