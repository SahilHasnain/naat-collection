services:
  naat-ai:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  naat-ai-voice:
    build: .
    command: ["python", "voice_worker.py"]
    env_file:
      - .env
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - AI_VOICE_WORKER_ID=naat-ai-voice
      - AI_VOICE_LEASE_SECONDS=1800
    volumes:
      - ./logs-voice:/app/logs
    restart: unless-stopped
    healthcheck:
      disable: true

  naat-ai-test:
    build: .
    env_file:
      - .env.test
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - AI_WORKER_MODE=test
      - AI_WORKER_ID=naat-ai-test
      - APPWRITE_TEST_JOBS_COLLECTION_ID=ai_model_test_jobs
      - APPWRITE_TESTS_COLLECTION_ID=naat_model_tests
      - APPWRITE_TEST_AUDIO_BUCKET_ID=audio-files-test
      - AI_JOB_LEASE_SECONDS=1800
    volumes:
      - ./logs-test:/app/logs
    restart: unless-stopped
    profiles:
      - test
